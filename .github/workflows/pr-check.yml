name: Build check

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python build.py
      - name: Verify baked output
        run: |
          grep -q 'href="applescript://com.apple.ScriptEditor2?action=new&script=' dist/index.html
          ! grep -q '{{APPLESCRIPT' dist/index.html
